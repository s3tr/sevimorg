<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sevim.org</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    } 

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      text-align: center;
    }

    .site-name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #e8e8e8;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="site-name">sevim.org</span>
  </div>
</body>
</html>
