<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVIM.ORG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            /* Pure Dark Background */
            background-color: #000;
            color: white;
            height: 100vh;
            margin: 0;
        }
        
        .title {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px rgba(255,255,255,0.4), 
                         0 0 30px rgba(0,255,255,0.6);
            letter-spacing: 0.2em;
            transition: transform 0.3s ease-out;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 1rem;
            display: block;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        /* Interactive Lens Halos */
        .morph {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
        }
        
        /* Enhanced Warp Effect */
        .warp {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }
        
        .warp.active {
            animation: warp-expand 0.8s ease-out forwards;
        }
        
        @keyframes warp-expand {
            0% { transform: scale(0); opacity: 1; border-width: 4px; }
            100% { transform: scale(4); opacity: 0; border-width: 0px; }
        }

        /* Varied Sparkling Animation */
        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 10px #fff; }
        }
    </style>
</head>
<body class="relative flex items-center justify-center">
    <div id="starfield" class="absolute inset-0 overflow-hidden"></div>
    
    <div id="morph1" class="morph bg-blue-600 w-[500px] h-[500px]"></div>
    <div id="morph2" class="morph bg-indigo-800 w-[400px] h-[400px]"></div>
    
    <div class="relative z-10 text-center px-4 select-none">
        <h1 class="title text-5xl md:text-8xl font-bold">SEVIM.ORG</h1>
        <span class="subtitle text-sm md:text-xl">hobilcik</span>
    </div>
    
    <script>
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            const starCount = 250;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Randomize sparkle timing for "Better Sparkling"
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                star.style.animation = `sparkle ${duration}s infinite ${delay}s ease-in-out`;
                
                starfield.appendChild(star);
            }
        }
        
        function setupInteractivity() {
            const morph1 = document.getElementById('morph1');
            const morph2 = document.getElementById('morph2');
            const title = document.querySelector('.title');
            
            document.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                
                // Smoothly move halos
                morph1.style.transform = `translate(${clientX - 250}px, ${clientY - 250}px)`;
                morph2.style.transform = `translate(${clientX - 200}px, ${clientY - 200}px)`;
                
                // Tilt title slightly based on mouse
                const moveX = (clientX - window.innerWidth / 2) / 50;
                const moveY = (clientY - window.innerHeight / 2) / 50;
                title.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });

            document.addEventListener('mousedown', (e) => {
                // Create Warp Ring
                const warp = document.createElement('div');
                warp.className = 'warp';
                warp.style.left = `${e.clientX - 50}px`;
                warp.style.top = `${e.clientY - 50}px`;
                warp.style.width = '100px';
                warp.style.height = '100px';
                document.body.appendChild(warp);
                
                setTimeout(() => warp.classList.add('active'), 10);
                setTimeout(() => warp.remove(), 800);
                
                // Spacetime displacement of stars
                const stars = document.querySelectorAll('.star');
                stars.forEach(star => {
                    const dx = star.offsetLeft - e.clientX;
                    const dy = star.offsetTop - e.clientY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 250) {
                        const angle = Math.atan2(dy, dx);
                        const push = (250 - dist) * 0.5;
                        star.style.transform = `translate(${Math.cos(angle) * push}px, ${Math.sin(angle) * push}px)`;
                        
                        setTimeout(() => {
                            star.style.transform = 'translate(0, 0)';
                        }, 600);
                    }
                });
            });
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            createStarfield();
            setupInteractivity();
        });
    </script>
</body>
</html>
